# Builds WOCA and publishes it to GitHub Pages (https://hzmdin.github.io/WOCA/)
# every time the main branch is pushed. Tests must pass before anything is published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm install (not npm ci): a package-lock.json made on Windows leaves out
      # some Linux-only optional packages (@emnapi/*), which makes the strict
      # npm ci fail. npm install fills them in. Also copies the MediaPipe WASM
      # files (postinstall).
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
